spring.application.name=demo
spring.config.import=optional:file:./oauth.properties,optional:file:./smtp.properties
spring.datasource.url=jdbc:h2:file:/home/yasser_jemli/Documents/natation_fullstack_project/backend/demo/data/natationdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.generate-unique-name=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Spring Mail Properties for Real Passcode Notifications
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.auth.expose-passcode-for-dev=false

# OAuth2 Login
# Create OAuth apps in Google Cloud Console and GitHub Developer Settings.
# For local development, put real credentials in backend/demo/oauth.properties.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dev-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dev-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
app.oauth2.redirect-uri=http://localhost:4200/oauth-callback
